[package]
name = "grab"
version = "0.1.1"
description = "Grab: download, play and edit your media"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "grab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
# Pinned to releases ≥7 days old (same rule as pnpm-workspace.yaml)
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-notification = "=2.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite compiled into the app: no system dependency
rusqlite = { version = "0.42", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
# Tool manager: download, verify, unpack
reqwest = "0.13"
sha2 = "0.11"
hex = "0.4"
zip = "9"
# Audio tags and cover art (Spotify imports, music library)
lofty = "=0.25.5"
# Music library: watch folders for new/changed songs (notify 8.2.2 is <7 days old)
notify = "=8.2.1"
notify-debouncer-mini = "=0.7.0"
# Media keys + Windows media overlay (SMTC)
souvlaki = "=0.9.3"
tauri-plugin-autostart = "=2.7.0"
# A second launch focuses the running Grab (which may be hidden in the tray)
tauri-plugin-single-instance = "=2.5.5"
# Updates for Grab itself from GitHub Releases (signed)
tauri-plugin-updater = "=2.14.1"
tokio = { version = "1", features = ["fs", "io-util", "process", "time", "sync", "macros"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
